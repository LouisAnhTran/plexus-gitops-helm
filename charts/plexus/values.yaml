# ─────────────────────────────────────────────────────────────────────────────
#  Plexus — default values
#
#  Image tags are per-service on purpose: CI bumps one service at a time, and a
#  shared appVersion would force every pod to restart when only one changed.
#  A PR from GitHub Actions edits exactly one `tag:` line below.
# ─────────────────────────────────────────────────────────────────────────────

# Registry prefix for our own images. Set once; each service appends its name.
#   asia-southeast1-docker.pkg.dev/<project>/<repo>
imageRegistry: asia-southeast1-docker.pkg.dev/plexus-louis-2026/plexus

imagePullPolicy: IfNotPresent

# ── Secrets ──────────────────────────────────────────────────────────────────
# The chart never contains secret values. Two modes:
#
#   create: false  (default, and what GitOps should use)
#       The Secret is created out-of-band and referenced by name. Nothing
#       sensitive is in Git. Create it once with:
#
#         kubectl -n plexus create secret generic plexus-secrets \
#           --from-literal=ANTHROPIC_API_KEY=... \
#           --from-literal=OPENAI_API_KEY=... \
#           --from-literal=EINVOICE_API_KEY=... \
#           --from-literal=POSTGRES_PASSWORD=...
#
#   create: true
#       Renders a Secret from the values below. Only for a throwaway cluster,
#       and only with `--set` or a gitignored values file — never commit them.
#
# The real fix later is a secret manager: Sealed Secrets, SOPS, or External
# Secrets backed by GCP Secret Manager. Then this flips back to create: false
# and something else populates the Secret.
secrets:
  name: plexus-secrets
  create: false
  values:
    ANTHROPIC_API_KEY: ""
    OPENAI_API_KEY: ""
    EINVOICE_API_KEY: ""
    POSTGRES_PASSWORD: ""

# ── Postgres (in-cluster, with pgvector) ─────────────────────────────────────
postgres:
  enabled: true
  # Upstream image: kb_articles.embedding is vector(1536), so plain postgres
  # would fail at CREATE EXTENSION vector.
  image:
    repository: pgvector/pgvector
    tag: pg16
  user: postgres
  database: plexus
  port: 5432
  storage: 10Gi
  # No storageClassName: GKE's default (pd-balanced) is what we want.
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }

# ── The agent host: LangGraph runtime + MCP client ───────────────────────────
mcpHostBackend:
  image:
    name: mcp-host-backend
    tag: ee5b21452d92
  # Pinned at 1. The MCP tool cache is per-process, and init_db() runs DDL on
  # startup — two replicas would race on CREATE TABLE IF NOT EXISTS and only
  # one would hold a warm cache. Raising this needs the migration Job first.
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }

# ── The dummy business API the MCP server wraps ──────────────────────────────
einvoiceApi:
  image:
    name: einvoice-api
    tag: ef453192f3f9
  # Pinned at 1: storage is in-process SQLite, so two replicas would be two
  # divergent databases serving the same clients.
  replicas: 1
  port: 8100
  # ":memory:" or a path. A path needs a volume; not worth it for a dummy.
  databasePath: ":memory:"
  # Seconds each pending state sits before it settles.
  autoAdvanceSeconds: "30"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }

# ── The MCP server ───────────────────────────────────────────────────────────
einvoiceMcp:
  image:
    name: einvoice-mcp
    tag: 3dd5af6675fe
  # Safe to scale: the server runs with stateless_http=True, so any replica can
  # serve any request without session affinity.
  replicas: 1
  port: 9000
  apiTimeoutSeconds: "15"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

# ── React UI (static files) ──────────────────────────────────────────────────
frontend:
  image:
    name: plexus-frontend
    tag: 59a89db39302
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 256Mi }

# ── Ingress — the entry point ────────────────────────────────────────────────
# Routes /api to the host backend and / to the frontend. There is no in-cluster
# proxy: the ingress controller does the path split itself.
#
#   ⚠️ ingress-nginx installs a Service of type LoadBalancer, so this DOES cost
#   money on GKE — roughly $18-22/month, i.e. ~$0.60/day, which is proportional
#   if the cluster only runs for a few hours. To avoid it entirely you would use
#   controller.service.type=NodePort and hit a node IP, or skip Ingress and run
#   cloudflared as a pod.
#
#   ⚠️ The app has no authentication and allow_origins=["*"]. Anyone who reaches
#   it can create agents and chat, which spends real Anthropic/OpenAI credits.
#   Fine for a cluster that lives for hours; not for one left up.
ingress:
  enabled: true

  # ingress-nginx, not GKE's built-in "gce" class. The gce controller needs
  # backend Services to be NodePort (or NEG-annotated for container-native
  # load balancing); ingress-nginx routes to ClusterIP Services directly, which
  # is what this chart creates.
  #
  # Install the controller once per cluster — it is not part of this chart:
  #   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
  #   helm install ingress-nginx ingress-nginx/ingress-nginx \
  #     -n ingress-nginx --create-namespace
  className: nginx

  # Leave empty to match any hostname, so you can hit the load balancer's IP
  # directly with no DNS at all. Set a hostname once you have one.
  host: ""

  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

  tls:
    enabled: false
    secretName: plexus-tls
