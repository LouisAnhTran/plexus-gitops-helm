{{/*
Credentials.

Rendered ONLY when secrets.create is true, which is not the default. In GitOps
the Secret is created out-of-band and this chart just references it by name —
because anything rendered from values.yaml has to come *from* values.yaml, and
values.yaml is in Git.

  kubectl -n plexus create secret generic plexus-secrets \
    --from-literal=ANTHROPIC_API_KEY=... \
    --from-literal=OPENAI_API_KEY=... \
    --from-literal=EINVOICE_API_KEY=... \
    --from-literal=POSTGRES_PASSWORD=...

Argo CD will not delete or overwrite a Secret it did not create, so a
hand-made one survives every sync.

When you move to a secret manager (Sealed Secrets, SOPS, External Secrets +
GCP Secret Manager), that tool creates this same Secret name and this file
stays disabled.
*/}}
{{- if .Values.secrets.create }}
{{- if not .Values.secrets.values.POSTGRES_PASSWORD }}
{{- fail "secrets.create is true but secrets.values.POSTGRES_PASSWORD is empty — pass it with --set, do not commit it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plexus.secretName" . }}
  labels:
    {{- include "plexus.labels" . | nindent 4 }}
  annotations:
    # Rendered from Helm values: treat as development-only.
    plexus.dev/managed-by: helm-values
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
