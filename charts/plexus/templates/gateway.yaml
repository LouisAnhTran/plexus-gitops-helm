{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plexus.componentName" (dict "root" $ "component" "gateway") }}
  labels:
    {{- include "plexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      name: http
  selector:
    {{- include "plexus.selectorLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plexus.componentName" (dict "root" $ "component" "gateway") }}
  labels:
    {{- include "plexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "plexus.selectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plexus.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        # Caddy does not watch the file, so the pod must roll when routes change.
        checksum/caddyfile: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "plexus.componentName" (dict "root" $ "component" "gateway") }}-config
{{- end }}
