{{- if .Values.ingress.enabled }}
{{/*
Public entry point.

The entry point: /api to the host backend, everything else to the frontend. The
controller does the path split, so there is no in-cluster proxy.

Path ordering matters: /api must come first. Ingress path matching is not
guaranteed to prefer the longest prefix across all controllers, and a "/" rule
evaluated first would swallow /api requests into the frontend, which serves a
404 page instead of proxying.
*/}}
{{- if and .Values.ingress.tls.enabled (not .Values.ingress.host) }}
{{- fail "ingress.tls.enabled requires ingress.host — a certificate has to be issued for a name, not an IP" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plexus.fullname" . }}
  labels:
    {{- include "plexus.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
      # No `host` when none is set: the rule then matches any hostname, so you
      # can hit the load balancer's IP directly without configuring DNS.
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "plexus.componentName" (dict "root" $ "component" "mcp-host-backend") }}
                port:
                  number: {{ .Values.mcpHostBackend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "plexus.componentName" (dict "root" $ "component" "frontend") }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
